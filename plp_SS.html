<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/logos/Favicon.png" />
    <link rel="stylesheet" type="text/css" href="dist/styles.css" />
    <script src="app/js/script.js" async></script>
    <title>PLP: SmartSUPPLY
    </title>
  </head>
  <body>
    <div id="header_SS"></div>
    <div id="navbar_SS"></div>
    <div id="breadcrumbs">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item breadcrumb-home"><a href="index.html" aria-label="Home"><span class="breadcrumb-home-text">Home</span><img class="breadcrumb-home-icon-img" src="images/icons/breadcrumb/home_24.svg" alt="" width="24" height="24"></a></li>
          <li class="breadcrumb-item active">1,069 items found</li>
        </ol>
      </nav>
    </div>

    <div id="main">
      <div id="plp">
      <div id="plp_filter"></div>
      <div class="plp-filter-backdrop" id="plp_filter_backdrop" hidden></div>

      <section class="plp-results" aria-labelledby="plp_title">
        <!-- LG and smaller: opens the filter panel -->
        <button type="button" class="plp-filter-open" id="plp_filter_open" aria-controls="plp_filter" aria-expanded="false">
          <span>Filter</span>
          <img src="images/icons/plp/filter_square.svg" alt="" width="24" height="24">
        </button>
        <h1 class="plp-title" id="plp_title">Results for &ldquo;6202&rdquo;</h1>
        <div class="plp-pill-bar" id="plp_pill_bar" hidden>
          <ul class="plp-pills" aria-label="Applied filters"></ul>
          <button type="button" class="plp-reset-filters" id="plp_reset_filters">Reset Filters</button>
        </div>
        <div id="plp_cards" class="plp-card-grid" data-card="plp-card-SS.html" data-alt-card="plp-card-SS-crib.html" data-alt-at="1,3" data-count="6"></div>
        <p class="plp-copy-status" role="status"></p>
      </section>
      </div>
    </div>
    <div id="compare_modal"></div>
    <div id="footer"></div>
  </body>
</html>
